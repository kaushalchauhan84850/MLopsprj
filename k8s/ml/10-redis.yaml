# Feature-window bus: collector pushes, analyzer pops, KEDA watches queue depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-ops
  labels: {app: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
          ports: [{containerPort: 6379, name: redis}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 320Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-ops
spec:
  selector: {app: redis}
  ports: [{port: 6379, name: redis}]
