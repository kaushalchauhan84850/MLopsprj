# One-shot bootstrap training (synthetic model day 0) + periodic retraining
# on accumulated real history.
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-trainer-bootstrap
  namespace: ai-ops
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: trainer
          image: k8s-ai-ops:dev
          args: ["src.trainer.train"]
          envFrom:
            - configMapRef: {name: ai-ops-config}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ai-ops-data}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-trainer
  namespace: ai-ops
spec:
  schedule: "17 */6 * * *" # every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trainer
              image: k8s-ai-ops:dev
              args: ["src.trainer.train"]
              envFrom:
                - configMapRef: {name: ai-ops-config}
              volumeMounts:
                - {name: data, mountPath: /data}
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {cpu: "1", memory: 1Gi}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: ai-ops-data}
