# Known failure modes (deterministic rules). The ML layer on top catches the
# unknown ones. Every rule carries `debug` annotations with first debugging steps.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ai-ops-known-failures
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: kubernetes.health
      rules:
        - alert: PodCrashLoopBackOff
          expr: max by (namespace, pod) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}) == 1
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
            debug: |
              • kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} --previous --tail=100
              • kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
              • If it started after a deploy: kubectl -n {{ $labels.namespace }} rollout undo deploy/<owner>
        - alert: PodNotReady
          expr: (kube_pod_status_ready{condition="false"} == 1) unless on (namespace, pod) (kube_pod_status_phase{phase="Succeeded"} == 1)
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} NotReady for 15m"
            debug: |
              • kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }} (Conditions, probes, events)
              • Readiness probe failing? Check the app's dependency health / startup time
        - alert: ContainerOOMKilled
          expr: changes(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) > 0
          labels: {severity: critical}
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
            debug: |
              • Memory limit too low or leak — check memory trend in Grafana
              • kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}
        - alert: NodeUnderPressure
          expr: max by (node) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"}) == 1
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "Node {{ $labels.node }} reports {{ $labels.condition }}"
            debug: |
              • kubectl describe node {{ $labels.node }} (Allocated resources)
              • Evictions imminent — consider cordon/drain
        - alert: NodeFilesystemFillingUp
          expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.90
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Root filesystem on {{ $labels.instance }} is >90% full"
            debug: "• df -h / on the node; clean images/logs: crictl rmi --prune, journalctl --vacuum-size=500M"
        - alert: PVCAlmostFull
          expr: (1 - kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 20m
          labels: {severity: warning}
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is >85% full"
            debug: "• Expand the PVC (allowVolumeExpansion) or clean data; check log retention on writers"
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} is down"
            debug: "• kubectl -n <ns> get pods — is the exporter/app pod alive? Check /metrics endpoint."
    - name: application.health
      rules:
        - alert: HTTPServerErrorRate
          expr: |
            sum by (namespace, service) (rate(http_requests_total{status=~"5.."}[5m]))
              / clamp_min(sum by (namespace, service) (rate(http_requests_total[5m])), 0.001) > 0.05
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "Service {{ $labels.namespace }}/{{ $labels.service }} 5xx rate > 5%"
            debug: |
              • Grafana Explore -> Loki: {namespace="{{ $labels.namespace }}"} |~ "(?i)error|exception"
              • Check dependencies (DB/cache) and recent rollouts
        - alert: HTTPHighLatencyP95
          expr: histogram_quantile(0.95, sum by (le, namespace, service) (rate(http_request_duration_seconds_bucket[5m]))) > 1
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Service {{ $labels.namespace }}/{{ $labels.service }} p95 latency > 1s"
            debug: "• Downstream saturation? Check CPU throttling, DB slow queries, and current replica count."
