# Helm values for prometheus-community/kube-prometheus-stack
# install: helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#            -n monitoring -f k8s/monitoring/kube-prometheus-stack-values.yaml
fullnameOverride: kube-prometheus-stack

defaultRules:
  create: true # keep the standard Kubernetes mixin rules as a baseline

prometheus:
  prometheusSpec:
    retention: 3d
    # pick up ServiceMonitors / PrometheusRules created outside this release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

grafana:
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true # auto-load ConfigMaps labelled grafana_dashboard=1
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring.svc:3100

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: ai-rca # everything goes through the AI RCA enrichment
    receivers:
      - name: ai-rca
        webhook_configs:
          - url: http://ai-analyzer.ai-ops.svc:8080/webhook/alerts
            send_resolved: true
      # Optional parallel Slack receiver (in addition to the AI webhook):
      # - name: slack
      #   slack_configs:
      #     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
      #       channel: "#ops-alerts"
      #       send_resolved: true
